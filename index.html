<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quran Firm Plant — Hifz Memorization Assistant</title>
    <!-- Google Fonts for Amiri (Arabic Quranic text) and Inter (UI Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="brand-name">Quran Firm Plant</span>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-btn active" data-module="page-map">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="3" y1="15" x2="21" y2="15"/>
            </svg>
            <span>Visual Page Map</span>
          </button>
          <button class="nav-btn" data-module="writing">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            <span>Writing Practice</span>
          </button>
          <button class="nav-btn" data-module="voice-finder">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span>Voice Finder</span>
          </button>
          <button class="nav-btn" data-module="quiz">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Recitation Quiz</span>
          </button>
          <button class="nav-btn" data-module="mutashabihat">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Mutashabihat</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="status-indicator offline">
            <span class="status-dot"></span>
            <span class="status-text">Database Loading...</span>
          </div>
        </div>
      </aside>

      <!-- Sidebar backdrop overlay for mobile -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Main Layout -->
      <main class="main-layout">
        <header class="app-header">
          <div class="header-left">
            <button id="hamburger-btn" class="hamburger-btn" aria-label="Toggle navigation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <h1 id="module-title">Visual Mushaf Page Map</h1>
          </div>
          <div class="header-right">
            <!-- Global Quran Selector Component -->
            <div id="global-selector-container"></div>
          </div>
        </header>

        <!-- Main Content Area -->
        <section id="app-content" class="content-container">
          <!-- Dynamic Module Content Injected Here -->
        </section>
      </main>
    </div>

    <!-- Data Loading Overlay Modal -->
    <div id="db-loading-overlay" class="overlay active">
      <div class="loading-card">
        <svg class="loading-icon animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-linecap="round"/>
        </svg>
        <h3>Preparing Offline Quran Database</h3>
        <p>Downloading and caching 604 standard pages & translations...</p>
        <div class="progress-bar-container">
          <div id="db-progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <span id="db-progress-text">0% (0 / 604 pages)</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
